[package]
name = "sound95"
version = "0.6.1"
description = "Sound95 - a Windows 95 style SoundCloud client"
authors = ["Flint"]
edition = "2021"

[lib]
name = "sound95_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "gzip"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
url = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-single-instance = "2"
discord-rich-presence = "1.1.0"

[target."cfg(windows)".dependencies]
wasapi = "0.26.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# A smaller download and install. Panics must keep unwinding: the tray is built
# inside catch_unwind, and Linux systems without a tray library rely on that.
[profile.release]
lto = true
codegen-units = 1
strip = true
