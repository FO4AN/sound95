name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  # A draft, so the updater never sees a release that's only half uploaded.
  create:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
      notes: ${{ steps.draft.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: draft
        run: |
          git fetch --force --tags origin
          gh release create "$TAG" --draft --verify-tag --title "Sound95 $TAG" --notes-from-tag
          gh release upload "$TAG" tools/install-linux.sh
          echo "id=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<NOTES_END'
            git tag -l --format='%(contents)' "$TAG"
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # The AppImage brings its own GTK and WebKitGTK but uses the system's glibc, so
          # build on the oldest system we support. Keep in step with tools/install-linux.sh.
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create.outputs.id }}
          releaseBody: ${{ needs.create.outputs.notes }}
          updaterJsonPreferNsis: true
      # Stops a runner upgrade quietly raising the glibc the AppImage needs.
      - name: Check the AppImage runs on glibc 2.35
        if: runner.os == 'Linux'
        run: tools/check-glibc.sh 2.35 src-tauri/target/release/bundle/appimage/*.AppImage

  # The tests run alongside the build. If they fail, the release stays a draft.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [build, ci]
    runs-on: ubuntu-24.04
    steps:
      - run: gh release edit "$TAG" --draft=false --latest
