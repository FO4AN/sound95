name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs these before it publishes.
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: node ../tools/check-lang.mjs
        if: runner.os == 'Linux'
      - run: node ../tools/check-gif.mjs
        if: runner.os == 'Linux'
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo build --locked
        working-directory: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Drive the real app against the mock server
        shell: bash
        env:
          OUT: ${{ runner.temp }}/e2e
          SOUND95_BIN: src-tauri/target/debug/sound95.exe
        run: tools/e2e.sh | tee e2e.log; grep -q '^RESULT failures=0' e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e
          path: |
            e2e.log
            ${{ runner.temp }}/e2e
